<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h1>{{ title }}</h1>

    {% if warning %}
    <div class="alert">{{ warning }}</div>
    {% endif %}

    {% if rows %}
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Timestamp</th>
            <th>Label</th>
          </tr>
        </thead>
        <tbody>
          {% for row in rows %}
          <tr>
            <td>{{ row.get("ID") }}</td>
            <td>{{ row.get("Timestamp") }}</td>
            <td>{{ row.get("Label") }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
      <p class="muted">Задача выполнена. Нет специальных табличных данных для отображения.</p>
    {% endif %}
  </div>
</body>
</html>
